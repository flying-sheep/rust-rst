# The workflow name is mandated by autofix.ci.
# It needs to be a dedicated workflow, as autofix.ci times out on long runs.
name: autofix.ci

on:
  pull_request:

env:
  FORCE_COLOR: "1"
  UV_COMPILE_BYTECODE: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Run pre-commit hooks
        run: uvx prek run --all-files --show-diff-on-failure --color=always
      - uses: autofix-ci/action@v1.3.4
        if: ${{ !cancelled() }}
